<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E2522"/>
      <stop offset="50%" stop-color="#7A1F1D"/>
      <stop offset="100%" stop-color="#581514"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="#F4EFEB"/>
       <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="#7A1F1D" stroke-opacity="0.15" stroke-width="3"/>

  <!-- Classical Architectural "C" Monogram -->
  <g transform="translate(256, 256)">
    <!-- 1. Classical Roman "C" Outer & Inner Bowl -->
    <!-- Modeled after Trajan / Centaur classical Roman capital C -->
    <path d="
      M 116 -128
      C 134 -128, 146 -114, 146 -98
      C 146 -80, 130 -66, 112 -66
      C 98 -66, 88 -76, 78 -88
      C 52 -122, 10 -144, -40 -144
      C -118 -144, -172 -88, -172 0
      C -172 88, -118 144, -40 144
      C 10 144, 52 122, 78 88
      C 88 76, 98 66, 112 66
      C 130 66, 146 80, 146 98
      C 146 114, 134 128, 116 128
      C 82 128, 54 168, -38 168
      C -138 168, -204 96, -204 0
      C -204 -96, -138 -168, -38 -168
      C 54 -168, 82 -128, 116 -128
      Z
    " fill="url(#burgundyGrad)"/>

    <!-- 2. Integrated Classical Column (fluted Roman/Greek pillar) -->
    <!-- The column stands along the inner-left axis, linking top and bottom -->
    <g id="column-group">
      <!-- Capital (Abacus & Echinus) -->
      <rect x="-140" y="-124" width="60" height="12" rx="2" fill="#7A1F1D"/>
      <path d="M -136 -112 L -126 -100 L -94 -100 L -84 -112 Z" fill="#581514"/>
      <rect x="-130" y="-100" width="40" height="5" rx="1" fill="#7A1F1D"/>

      <!-- Fluted Column Shaft -->
      <!-- Background of shaft -->
      <rect x="-126" y="-95" width="32" height="190" fill="#581514"/>
      <!-- Flutes (crisp vertical channels) -->
      <rect x="-124" y="-92" width="6" height="184" rx="3" fill="#F4EFEB"/>
      <rect x="-114" y="-92" width="6" height="184" rx="3" fill="#F4EFEB"/>
      <rect x="-104" y="-92" width="6" height="184" rx="3" fill="#F4EFEB"/>

      <!-- Base (Torus, Scotia, Plinth) -->
      <rect x="-130" y="95" width="40" height="5" rx="1" fill="#7A1F1D"/>
      <path d="M -126 100 L -136 112 L -84 112 L -94 100 Z" fill="#581514"/>
      <rect x="-140" y="112" width="60" height="14" rx="2" fill="#7A1F1D"/>
    </g>

    <!-- 3. Central Classical Diamond Accent (Aperture Ornament) -->
    <g transform="translate(48, 0)">
      <!-- Outer diamond -->
      <polygon points="0,-36 36,0 0,36 -36,0" fill="url(#burgundyGrad)"/>
      <!-- Inner diamond cutout -->
      <polygon points="0,-18 18,0 0,18 -18,0" fill="#F4EFEB"/>
      <!-- Center jewel bead -->
      <polygon points="0,-8 8,0 0,8 -8,0" fill="#7A1F1D"/>
    </g>
  </g>
</svg>