<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="burgundyGradMaskable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E2522"/>
      <stop offset="50%" stop-color="#7A1F1D"/>
      <stop offset="100%" stop-color="#581514"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#F4EFEB"/>

  <!-- Classical Architectural "C" Monogram with padding for Android safe-zone -->
  <g transform="translate(256, 256) scale(0.72)">
